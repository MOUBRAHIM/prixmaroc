#
# Réveil de l'API — empêche l'hébergement de mettre le serveur en veille.
#
# L'offre gratuite de Render endort un service inactif au bout d'un quart
# d'heure. Le réveil suivant prend près d'une minute : mesuré à 56 s. Un
# utilisateur qui ouvre l'application dans un rayon de supermarché n'attend
# pas une minute devant un écran vide — il la désinstalle.
#
# On appelle donc /health toutes les dix minutes. Le dépôt étant public, les
# minutes GitHub Actions sont gratuites et sans plafond.
#
# Deux limites connues, assumées :
#   - GitHub décale fréquemment les tâches programmées de cinq à quinze
#     minutes aux heures chargées. Une veille occasionnelle reste possible ;
#     l'appel suivant la lève.
#   - GitHub désactive les tâches programmées d'un dépôt sans commit depuis
#     soixante jours. Le bouton « Run workflow » les réactive.
#
name: Réveil de l'API

on:
  schedule:
    # Toutes les heures, et non toutes les dix minutes : mesuré sur une
    # journée, « */10 » n'a déclenché que cinq fois — GitHub abandonne les
    # exécutions en attente des planifications trop fréquentes. Une demande
    # horaire est honorée bien plus souvent.
    - cron: "7 * * * *"
  workflow_dispatch:

# Rien n'est écrit dans le dépôt : lecture seule.
permissions:
  contents: read

concurrency:
  group: reveil-api
  cancel-in-progress: true

jobs:
  appeler:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Maintenir l'API éveillée pendant une heure
        run: |
          URL="https://prixmaroc-api-07el.onrender.com/health"
          # Render endort après un quart d'heure d'inactivité. Une exécution
          # qui appellerait une seule fois laisserait le service se rendormir
          # dix minutes plus tard. On appelle donc en boucle pendant toute
          # l'heure : le dépôt étant public, ces minutes sont gratuites.
          INTERVALLE=300     # 5 min
          TOURS=11           # ≈ 55 min de couverture

          echecs=0
          for tour in $(seq 1 $TOURS); do
            debut=$(date +%s)
            code=$(curl -sS --max-time 120 --retry 1 --retry-delay 10 \
                        -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            duree=$(( $(date +%s) - debut ))
            echo "[$tour/$TOURS] HTTP $code en ${duree}s"

            if [ "$code" != "200" ]; then
              echecs=$(( echecs + 1 ))
            elif [ "$duree" -gt 20 ]; then
              echo "::warning::Réveil lent (${duree}s) — le service s'était endormi."
            fi

            [ "$tour" -lt "$TOURS" ] && sleep "$INTERVALLE"
          done

          # Un incident passager ne doit pas peindre l'historique en rouge ;
          # une API réellement tombée, si.
          if [ "$echecs" -ge 3 ]; then
            echo "::error::$echecs appels en échec sur $TOURS — API en panne."
            exit 1
          fi
          echo "Terminé : $(( TOURS - echecs ))/$TOURS appels réussis."
